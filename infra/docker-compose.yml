services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alghaly}
      POSTGRES_USER: ${POSTGRES_USER:-alghaly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-local-password}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata: {}
